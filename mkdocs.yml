site_name: Victron Venus documentation
site_url: https://victron-venus.github.io/docs/
site_description: >-
  Installation, integration and reference documentation for the Victron Venus OS
  projects maintained by the victron-venus organization.
repo_url: https://github.com/victron-venus
edit_uri: ""

docs_dir: docs

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.follow
    - content.code.copy
    - search.highlight
    - search.share
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  # Diagrams: 239 mermaid blocks exist across the repositories and none of them
  # render anywhere today. Render them here instead of rewriting them.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets

plugins:
  - search:
      separator: '[\s\-\.]+'
  - awesome-pages

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn

extra:
  generator: false

# Navigation is generated by awesome-pages from the files on disk, so adding a
# project page never means editing this file.
